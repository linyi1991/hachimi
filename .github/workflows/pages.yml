name: Publish Hachimi
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - run: node build.mjs
      - run: node test.mjs
      - run: node ime-test.mjs
      - run: node warehouse-test.mjs
      - run: node completion-entry-test.mjs
      - run: node allocation-test.mjs
      - run: node retainer-test.mjs
      - run: node gathering-test.mjs
      - run: node action-plan-test.mjs
      - run: node priority-plan-test.mjs
      - run: node leveling-guide-test.mjs
      - run: node voyage-sync-test.mjs
      - run: node next-swap-test.mjs
      - run: node material-phases-test.mjs
      - run: node guest-test.mjs
      - run: node special-source-test.mjs
      - run: node execution-test.mjs
      - run: node craft-test.mjs
      - run: node workflow-test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
