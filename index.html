function workshop(){ $('#content').innerHTML=hero('THE SHARED WORKSHOP','把材料備齊，一起出航。','從第一艘鯊魚級，到四艘普通 3124。<br>要交多少、已經搓好多少，一眼就能看清楚。',scopePills)+`<section class="stats" id="stats" aria-label="備料摘要"></section><section class="board"><div class="boardhead"><div><h2>工房交付成品</h2><p id="board-description">這裡只列實際交工房的成品；製作成品用掉的原料不重複加進來。</p></div><div class="fleet-stage-controls"><div class="fleet-buttons" role="group" aria-label="計算船數"><span>計算船數</span>${[1,2,3,4].map(n=>`<button data-fleet="${n}" class="${n===fleetCount?'on':''}" aria-pressed="${n===fleetCount}">${n} 艘</button>`).join('')}</div><div class="tabs" role="group" aria-label="階段"><button data-stage="all" class="on">全部成品</button><button data-stage="start">1111 起步</button><button data-stage="upgrade">3124 換裝</button></div></div></div><div class="fleet-scope" id="fleet-scope"></div><div class="toolbar"><div class="search"><input id="search" placeholder="搜尋材料，例如：鈷鐵、木材…" aria-label="搜尋材料"></div><div class="filters"><select id="group" aria-label="材料分類"><option value="all">全部分類</option><option>金屬</option><option>木材</option><option>寶石</option><option>煉金</option></select><label><input type="checkbox" id="missing">只看還缺</label><button class="mini-btn" id="csv">四艘進度 CSV</button><a class="mini-btn" href="/download.xlsx" style="text-decoration:none">四艘 Excel 範本 ↗</a></div></div><div class="table-wrap"><table><thead id="thead"></thead><tbody id="rows"></tbody></table></div><div class="tablefoot"><span id="count"></span><span>點材料名稱可查看配方與零件用途</span></div></section><div class="bottom-note"><span class="note-dot">i</span><div><b>已備妥包含已交付。</b> 例如備妥 100、其中交出 30，仍填已備妥 100、已交付 30。${canEdit?'修改數量後，按該列「儲存」或 Enter。':'目前為唯讀；需以帳號密碼登入後，才能填數量與分工。'}<br>舊表有跨頁與跨層的共用庫存餘額，因此未自動匯入；請依目前實際成品重新盤點。空白初始進度不代表沒有庫存。</div></div>`;
 $('#search').oninput=e=>{query=e.target.value;renderRows();};$('#group').onchange=e=>{group=e.target.value;renderRows();};$('#missing').onchange=e=>{onlyMissing=e.target.checked;renderRows();};$('#csv').onclick=exportCSV;document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=b.dataset.stage;document.querySelectorAll('[data-stage]').forEach(x=>x.classList.toggle('on',x===b));renderRows();});renderStats();renderRows();}
function required(i){return fleetRequired(i,fleetCount,stage);}
function stageCollected(i,s){return Math.max(0,s.collected-stepOffset(i,stage));}
function remaining(i,s){return Math.max(0,required(i)-stageCollected(i,s));}
function renderStats(){const ready=DATA.items.filter(i=>(state[i.id]?.collected||0)>=i.total).length,delivered=DATA.items.filter(i=>(state[i.id]?.delivered||0)>=i.total).length,progress=Math.round(DATA.items.reduce((t,i)=>t+Math.min(1,(state[i.id]?.collected||0)/i.total),0)/38*100);$('#stats').innerHTML=`<div class="stat"><label>四艘目標・成品種類</label><strong>38</strong><small>種材料</small></div><div class="stat"><label>四艘目標・已備齊</label><strong>${loading?'—':ready}</strong><small>/ 38 種</small><div class="meter" style="width:${ready/38*100}%"></div></div><div class="stat num-gold"><label>四艘目標・仍需備料</label><strong>${loading?'—':38-ready}</strong><small>種材料</small></div><div class="stat"><label>四艘目標・已交工房</label><strong>${loading?'—':delivered}</strong><small>/ 38 種</small></div>`;}
function renderRows(){if(page!=='workshop')return;$('#thead').innerHTML=`<tr><th>交付素材</th><th class="num">${stage==='all'?'全程總需求':stage==='start'?'1111 起步需求':'3124 換裝需求'} · ${fleetCount} 艘</th><th class="num">已備妥${stage!=='all'?'（全程）':''}</th><th class="num">已交付${stage!=='all'?'（全程）':''}</th><th class="num">還缺</th><th>負責 / 備註</th><th>${canEdit?'狀態 / 儲存':'狀態'}</th></tr>`;
if(loading){$('#rows').innerHTML='<tr><td colspan="7" class="empty">正在讀取共同清單…</td></tr>';$('#count').textContent='連線中';return;}
if(!online&&!Object.keys(state).length){$('#rows').innerHTML='<tr><td colspan="7" class="empty">暫時無法讀取共同進度，請按重新整理。需求數量可在零件配方頁查閱。</td></tr>';return;}
const shown=DATA.items.filter(i=>required(i)>0&&(group==='all'||i.group===group)&&(!query||[i.name,i.en,state[i.id]?.owner].join(' ').toLowerCase().includes(query.toLowerCase()))&&(!onlyMissing||remaining(i,state[i.id]||defaultState(i))>0));
$('#rows').innerHTML=shown.map(i=>{const s=state[i.id]||defaultState(i),draft=drafts[i.id],v=draft||s,missing=remaining(i,s),cl=({'木材':'wood','寶石':'gem','煉金':'alc'})[i.group]||'',icon=({'木材':'▱','寶石':'◇','煉金':'♧','金屬':'▰'})[i.group];return `<tr data-id="${i.id}"><td><div class="item">${itemIcon(i.name)}<div><button class="item-name" data-detail="${i.id}">${esc(i.name)}</button><div class="item-sub">${esc(i.en)}</div></div></div></td><td class="num quantity">${num(required(i))}</td><td class="num">${canEdit&&fleetCount===4?`<input class="entry" type="number" min="0" max="1000000" step="1" inputmode="numeric" data-field="collected" aria-label="${esc(i.name)}已備妥" value="${v.collected}">`:num(s.collected)}</td><td class="num">${canEdit&&fleetCount===4?`<input class="entry" type="number" min="0" max="${i.total}" step="1" inputmode="numeric" data-field="delivered" aria-label="${esc(i.name)}已交付" value="${v.delivered}">`:num(s.delivered)}</td><td class="num ${missing?'missing':'done'}">${missing?num(missing):'備齊'}</td><td><button class="item-name" data-assign="${i.id}" style="font-size:12px;font-weight:400" ${canEdit?'':'disabled'}>${esc(v.owner||'尚未分工')}</button><div class="row-note" title="${esc(v.note)}">${esc(v.note||'—')}</div></td><td>${canEdit&&fleetCount===4?`<button class="mini-btn ${draft?'pending':''}" data-save="${i.id}" ${draft?'':'disabled'}>${draft?.conflict?'重新載入':draft?'儲存交付量':state[i.id]?'已儲存':'尚未填寫'}</button>`:`<span class="${missing?'tiny':'done-tag'}">${missing?'備料中':'已備齊'}</span>`}</td></tr>`;}).join('')||'<tr><td colspan="7" class="empty">目前沒有符合條件的材料。</td></tr>';$('#count').textContent=`顯示 ${shown.length} / ${DATA.items.filter(i=>required(i)>0).length} 種成品${stage==='upgrade'?' · 已備妥先分配給起步需求':''}`;
document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>itemDetail(b.dataset.detail));document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>editDetails(b.dataset.assign));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.dataset.save));
document.querySelectorAll('[data-field]').forEach(input=>{input.oninput=()=>{const id=input.closest('tr').dataset.id;drafts[id]||={...(state[id]||defaultState(DATA.items.find(i=>i.id===id)))};drafts[id][input.dataset.field]=input.value===''?NaN:Number(input.value);const b=input.closest('tr').querySelector('[data-save]');b.textContent=drafts[id].conflict?'重新載入':'儲存交付量';b.disabled=false;b.classList.add('pending');};input.onkeydown=e=>{if(e.key==='Enter')save(input.closest('tr').dataset.id);};});}
async function save(id){const draft=drafts[id];if(!draft)return;if(draft.conflict){delete drafts[id];if(page==='planner')renderPlan();else renderRows();return;}const item=DATA.inventoryNodes.find(i=>i.id===id);if(!Number.isInteger(draft.collected)||draft.collected<0||!Number.isInteger(draft.delivered)||draft.delivered<0||draft.delivered>Math.min(draft.collected,item.total)){toast('請檢查數量：已交付不可超過已備妥及總需求。',true);return;}const b=document.querySelector(`[data-save="${id}"]`);if(b){b.disabled=true;b.textContent='儲存中';b.closest('tr').querySelectorAll('input,[data-assign]').forEach(x=>x.disabled=true);}
try{const r=await fetch(api('/api/item'),{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+auth},body:JSON.stringify({id,...draft})});const body=await r.json();if(!r.ok){if(r.status===409){drafts[id].conflict=true;await refresh();}throw Error(body.error||'儲存失敗');}state[id]=body.item;delete drafts[id];if(page==='workshop'){renderRows();renderStats();}else if(page==='planner')renderPlan();toast(item.name+' 已儲存');}catch(e){toast(e.message,true);if(page==='planner')renderPlan();else renderRows();}}
function editDetails(id){if(!canEdit)return;const i=DATA.items.find(i=>i.id===id),s=drafts[id]||state[id]||defaultState(i);openModal(i.name,'分工與備註',`<label class="field">負責人<input id="owner" maxlength="40" value="${esc(s.owner)}" placeholder="例如：小哈"></label><label class="field">備註<textarea id="note" maxlength="200" placeholder="例如：這批放在部隊箱第一頁">${esc(s.note)}</textarea></label><div class="dialog-actions"><button class="btn primary" id="save-details">儲存分工</button></div>`);$('#save-details').onclick=async()=>{drafts[id]={...s,owner:$('#owner').value,note:$('#note').value};$('#modal').close();await save(id);};}
function itemDetail(id){const i=DATA.items.find(i=>i.id===id),r=i.recipe;openModal(i.name,i.en,`<div class="pill" style="display:inline-block;margin-bottom:15px">四艘共需 ${num(i.total)} 個 · 起步 ${i.start} / 換裝 ${i.upgrade}</div><h3 style="font-size:14px">製作 1 次，產出 ${r.yield} 個</h3>${Object.entries(r.items).map(([n,q])=>`<div class="modal-line"><span class="ingredient-name">${itemIcon(n)}${esc(n)}</span><b>× ${q}</b></div>`).join('')}<h3 style="font-size:14px;margin-top:24px">交給哪些零件？（四艘）</h3>${i.uses.map(u=>`<div class="modal-line"><span>${esc(u.part)}</span><b>${u.qty}</b></div>`).join('')}<div class="linkbar"><a target="_blank" rel="noreferrer" href="${i.official}">官方素材配方 ↗</a><a target="_blank" rel="noreferrer" href="${r.url}">Wiki 配方 ↗</a></div><p class="tiny" style="line-height:1.9;margin-top:17px">此處為交付成品數量。若由原料全自製，還需準備其他成品製作時消耗的同名材料，請用 Excel 的「製作展開」頁統一計算。</p>`);}
async function refresh(){try{const r=await fetch(api('/api/state'),{headers:auth?{Authorization:'Bearer '+auth}:{}});if(!r.ok)throw Error();const b=await r.json();savedCalculation=b.calculation||null;dispatchState=b.dispatch||{revision:0,lines:[]};schematicState=Object.fromEntries((b.schematics||[]).map(x=>[x.schematic_id,x]));state=Object.fromEntries(b.items.map(x=>[x.item_id,x]));messageCounts=Object.fromEntries((b.messageCounts||[]).map(x=>[x.item_id,x.count]));online=true;const changed=canEdit!==b.canEdit;canEdit=b.canEdit;loading=false;$('#mode').textContent=canEdit?'已登入：'+(b.username||''):'唯讀瀏覽';$('#mode').className='badge'+(canEdit?' edit':'');currentUser=b.username||'';$('#unlock').hidden=false;$('#unlock').textContent=canEdit?(b.username+' ▾'):'登入';$('#lock').hidden=true;$('#sync').textContent='共用紀錄已連線';if(compositionActive())return;if(typeof renderUnlockSummary==='function')renderUnlockSummary();if(page==='workshop'){if(changed){stage=new URLSearchParams(location.search).get('view')==='all'?'all':savedCalculation?.stage||stage;fleetCount=savedCalculation?.fleet||fleetCount;query=new URLSearchParams(location.search).get('find')||'';group='all';onlyMissing=false;workshop();}else if(!document.activeElement?.matches('[data-field]')){renderRows();renderStats();}}if(page==='planner'&&!document.activeElement?.matches('[data-stock]'))renderPlan();if(page==='compare'&&!document.activeElement?.matches('#comparison-search'))renderComparison();}catch{online=false;loading=false;$('#sync').textContent='連線中斷';if(compositionActive())return;if(page==='workshop'){renderStats();renderRows();}if(page==='compare')renderComparison();}}
function exportCSV(){const header=['素材','起步需求','換裝需求','總需求','已備妥含已交','已交付','還缺','負責','備註'];const cell=v=>{let s=String(v??'');if(/^[=+@\-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';};const rows=DATA.items.map(i=>{const s=state[i.id]||defaultState(i);return [i.name,i.start,i.upgrade,i.total,s.collected,s.delivered,Math.max(0,i.total-s.collected),s.owner,s.note];});const url=URL.createObjectURL(new Blob(['\ufeff'+[header,...rows].map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Hachimi-四艘備料進度.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function partsPage(){$('#content').innerHTML=hero('COMPONENT LIBRARY','八種零件，三十二件。','1111 的鯊魚船尾沿用至 3124。<br>每艘另做四件，含一件練級過渡艦橋，材料不重複計算。',scopePills)+`<section class="partgrid">${DATA.parts.map((p,idx)=>`<article class="partcard"><span class="${p.stage==='start'?'tag-start':'tag-upgrade'}">${p.stage==='start'?'1111 起步':p.stage==='transition'?'練級過渡':'3124 換裝'}</span><h2 class="ingredient-name">${itemIcon(p.name)}${esc(p.name)}</h2><div class="en">${esc(p.en)}</div><div class="partmeta"><span>裝備 Rank ${p.rank}</span><b>製作 ×4 件</b></div><button class="btn" data-part="${idx}">查看完整工房配方 →</button></article>`).join('')}</section><div class="bottom-note"><span class="note-dot">i</span><div>每個配方已加總完整工序，不用再乘 3。本清單按所選輪替製作八種零件，已包含鬚鯨艦橋練級過渡件。</div></div>`;document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>partDetail(Number(b.dataset.part)));}
function partDetail(idx){const p=DATA.parts[idx];openModal(p.name,p.en,`<p class="tiny">下列為 1 件零件完整工序的工房繳交量；四艘需求請乘 4。</p>${Object.entries(p.ingredients).map(([n,q])=>`<div class="modal-line"><span class="ingredient-name">${itemIcon(n)}${esc(n)}</span><b>${q} <small style="color:#8b999e;font-weight:400;margin-left:10px">四件 ${q*4}</small></b></div>`).join('')}<div class="linkbar"><a href="${p.url}" target="_blank" rel="noreferrer">完整工序用料（Wiki）↗</a><a href="${p.official}" target="_blank" rel="noreferrer">官方物品頁 ↗</a></div>`);}
function guidePage(){$('#content').innerHTML=hero('THE CAPTAIN’S HANDBOOK','第一趟航程，從容開始。','把工房、製作與出航分開準備。<br>這份指南以四艘普通 3124 為目標，已包含鬚鯨艦橋練級過渡件。')+`<div class="grid2"><section class="panel"><div class="eyebrow">01 / GETTING STARTED</div><h2>從部隊工房到第一艘艇</h2><div class="step"><span class="stepnum">1</span><div><h3>先有部隊房與工房</h3><p>潛水艇使用部隊工房系統。先確認部隊已擁有房屋，並開放工房與相應操作權限。</p></div></div><div class="step"><span class="stepnum">2</span><div><h3>在製圖板解鎖設計圖</h3><p>零件製作計畫需先解鎖，再從工房製作設備的部隊製作筆記開始。設計圖解鎖材料另外準備。</p></div></div><div class="step"><span class="stepnum">3</span><div><h3>備齊並製作 1111</h3><p>鯊魚級船體、船尾、船首、艦橋各一件。主頁的起步清單已經是四艘合計，無需再乘四。</p></div></div><div class="step"><span class="stepnum">4</span><div><h3>登記、補給，再出航</h3><p>準備零件與潛水艇登記票，在工房航行管制面板登記。出航另需出航燃料（Ceruleum Tank），維修另需魔導機械修理材料。</p></div></div><div class="linkbar"><a target="_blank" rel="noreferrer" href="https://ffxiv.consolegameswiki.com/wiki/Subaquatic_Voyages">系統與前置條件來源 ↗</a></div></section><div><section class="panel"><div class="eyebrow">02 / YOUR BUILD</div><h2>讀懂 1111 與 3124</h2><p>順序固定為<strong>船體、船尾、船首、艦橋</strong>。1 鯊魚、2 甲鱟、3 鬚鯨、4 腔棘魚。</p><div class="path"><span>1111</span><i>→</i><span class="milestone">3124</span></div><p>換上鬚鯨船體、甲鱟船首、腔棘魚艦橋。鯊魚船尾繼續使用，依本工具輪替，每艘合計製作 8 件不同零件（含鬚鯨艦橋過渡件）。</p><div class="callout">零件可裝備等級分別為 Rank 15、25、35。能換裝不等於已滿足特定撈金航線門檻，實際出航仍須檢查等級、航距與目標海域。</div><a class="btn primary" href="/parts">查看八種零件配方 →</a></section><section class="panel"><div class="eyebrow">03 / DAILY ROUTINE</div><h2>每次收艇，留意三件事</h2><p><b>查看航行報告</b>：獎勵、經驗與新區域發現都在報告中確認。</p><p><b>檢查零件耐久</b>：探索會耗損耐久，準備好修理材料。</p><p><b>確認燃料與返航時間</b>：航線決定所需補給與航行時間，選擇自己能穩定收艇的節奏。</p><p class="tiny">本工具不保證開圖次數、練成天數或固定金幣收益。</p></section></div></div>`;}
function voyagesPage(){$('#content').innerHTML=hero('CHART THE NEXT VOYAGE','把第二、三、四艘，帶進工房。','先辨認擴編的關鍵海域，再安排下一趟探索。<br>解鎖區域需要探索觸發，單純達到等級不會自動增加船位。')+`<section class="panel"><div class="eyebrow">DEEP-SEA SITE / FLEET EXPANSION</div><h2>溺沒海的擴編主線</h2><div class="path">${['B','E','J','N','O','S','T'].map((n,i)=>`${i?'<i>→</i>':''}<span class="${['J','O','T'].includes(n)?'milestone':''}">${n}</span>`).join('')}</div><p>箭頭代表區域解鎖前置關係，不表示一次航行順序。新區域發現具有機率，可能需要重複探索。</p><div class="table-wrap"><table><thead><tr><th>關鍵區域</th><th>區域 Rank</th><th>擴編權限</th><th>另需登記票</th></tr></thead><tbody><tr><td>J · Unidentified Derelict</td><td>20</td><td>第 2 艘</td><td>3 張</td></tr><tr><td>O · The Wreckage of Discovery I</td><td>30</td><td>第 3 艘</td><td>5 張</td></tr><tr><td>T · Purgatory</td><td>40</td><td>第 4 艘</td><td>7 張</td></tr></tbody></table></div><div class="linkbar"><a href="https://ffxiv.consolegameswiki.com/wiki/Subaquatic_Voyages" rel="noreferrer" target="_blank">海域與登記條件 ↗</a><a href="https://ffxiv.consolegameswiki.com/wiki/Deep-sea_Site" rel="noreferrer" target="_blank">完整溺沒海海圖 ↗</a></div></section><div class="grid2"><section class="panel"><h2>五項性能，分別看什麼？</h2><div class="modal-line"><span>探索性能 Surveillance</span><span>影響可獲取的物品檔位</span></div><div class="modal-line"><span>收集性能 Retrieval</span><span>影響取得數量</span></div><div class="modal-line"><span>航速 Speed</span><span>影響航行時間</span></div><div class="modal-line"><span>航距 Range</span><span>影響可到達的區域與數量</span></div><div class="modal-line"><span>恩惠 Favor</span><span>影響同區域再次搜索</span></div><p class="tiny">區域門檻依目標不同；探索性能不提高發現新區域的機率。</p></section><section class="panel"><h2>接下來查什麼？</h2><p>要推進其他海域時，先查完整解鎖樹與目標區域，再確認當前配置和等級是否能抵達。</p><p>撈金航線的收益會受到掉落、出航頻率與達標性能影響。這裡不把攻略的估算當作固定收入。</p><div class="source-list"><a class="source-link" href="https://babelin.netlify.app/submarine" target="_blank" rel="noreferrer"><strong>中文海圖與航線工具 ↗</strong><p>參考你提供的海圖索引；材料數量以本工具核對後的配方為準。</p></a><a class="source-link" href="https://ffxiv.consolegameswiki.com/wiki/Subaquatic_Voyages" target="_blank" rel="noreferrer"><strong>各海域解鎖與掉落索引 ↗</strong><p>查詢溺沒海及後續海域。</p></a></div></section></div>`;}
function lookupPage(){
$('#content').innerHTML=hero('THE RESEARCH DESK','查材料，從正確的入口開始。','搜尋中文或英文物品名，直接找到對應官方物品與配方。<br>此索引涵蓋本次備料涉及的素材；不提供即時市價或未驗證的採集座標。')+`<section class="board"><div class="boardhead"><div><h2>素材與原料查詢</h2><p>官方物品連結依對應配方中的物品識別碼建立，不是同名搜尋的猜測結果。</p></div></div><div class="toolbar"><div class="search" style="width:min(500px,100%)"><input id="lookup-search" aria-label="查詢物品" placeholder="中文或英文，例如：焦炭、Cobalt…"></div><span id="lookup-count" class="tiny"></span></div><div class="source-list" id="lookup-list" style="padding:22px"></div></section>`;
function render(){const q=$('#lookup-search').value.toLowerCase();const matches=DATA.lookups.filter(i=>(i.name+' '+i.en).toLowerCase().includes(q));$('#lookup-count').textContent=`${matches.length} / ${DATA.lookups.length} 種物品`;$('#lookup-list').innerHTML=matches.map(i=>`<article class="source-link"><div style="display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap"><div class="lookup-item">${itemIcon(i.name)}<div><strong>${esc(i.name)}</strong><p>${esc(i.en)} · ${esc(i.type)}</p></div></div><div class="linkbar" style="margin:0"><a class="btn" href="${i.official}" target="_blank" rel="noreferrer">官方物品 ↗</a>${i.recipe?`<a class="btn" href="${i.recipe}" target="_blank" rel="noreferrer">官方配方 ↗</a>`:''}<a class="btn" href="${i.wiki}" target="_blank" rel="noreferrer">Wiki ↗</a></div></div></article>`).join('')||'<p class="empty">此份已核對索引沒有符合的物品。</p>';}
$('#lookup-search').oninput=render;render();
}
function sourcesPage(){
const link=(title,url,desc)=>`<a class="source-link" href="${url}" target="_blank" rel="noreferrer"><strong>${title} ↗</strong><p>${desc}</p></a>`;
$('#content').innerHTML=hero('THE VERIFIED ARCHIVE','每一份材料，都有來處。','把官方配方、社群工房資料與攻略建議分清楚。<br>核對日期：2026 年 11 月 7 日。')+`<section class="stats"><div class="stat"><label>工房交付素材</label><strong>38</strong><small>種</small></div><div class="stat"><label>逐項核對零件</label><strong>8</strong><small>種</small></div><div class="stat"><label>官方素材配方核對</label><strong>46</strong><small>種符合</small></div><div class="stat num-gold"><label>原表配方錯字修正</label><strong>1</strong><small>處</small></div></section><div class="grid2"><section class="panel"><h2>核對方式</h2><p><b>一般素材配方</b>：46 種配方（含解鎖紅木木材）的投入物品、數量與每次產出量，逐項比對官方 Lodestone 製作筆記，皆與本工具相符。</p><p><b>工房零件用料</b>：官方物品頁可確認物品，但沒有完整工房施工用料。八種零件的各階段總用料，由 Console Games Wiki 與你提供網站的配方交叉核對。</p><p><b>攻略內容</b>：前置、裝備 Rank、登記條件與海域解鎖關係採有來源的數據。不把估計收益、練成天數及未對上的屬性合計當作事實。</p><div class="callout">官方來源為國際服資料庫，繁中名稱沿用原始工作表；繁中服若有版本差異，以遊戲內製作筆記為準。</div><div class="source-list">${link('官方：聖雪松材配方','https://na.finalfantasyxiv.com/lodestone/playguide/db/recipe/2cf64df2661/','使用雪松木材 1、聖水 2、風之水晶 3。原表寫成「雪松木柴」，已修正。')}${link('官方：鬚鯨級船體物品頁','https://na.finalfantasyxiv.com/lodestone/playguide/db/item/15e326e19d9/','確認物品身份；此頁未列完整工房用料。')}</div></section><section class="panel"><h2>原工作表發現</h2><p><b>3124 填成了數量。</b> 四種零件仍選鯊魚級，3、1、2、4 填在製作數量欄，造成錯誤需求。</p><p><b>四頁庫存是共用餘額。</b> 不能相加，跨層也有同名庫存。新表留存原紀錄，未把不確定的餘額直接帶入。</p><p><b>Excel 可攜性。</b> 原 Google Sheets 公式多被匯出為回退快照。新表使用可計算公式，並測試共用庫存連動。</p><p><b>成品與原料分開。</b> 主頁是工房成品清單；全自製原料在 Excel「全自製展開」。兩套不可相加採購。</p><h3>參考網站與設計</h3><div class="source-list">${link('中文潛水艇攻略與材料工具',DATA.sourceReference,'參考中文用料、配置與海圖。原頁把 1121 說成換船尾，本站按部位順序採船首。')}${link('多方彙整潛水艇攻略 Gist',DATA.sourceGist,'攻略架構參考；配置屬性合計有矛盾的數字未採用。')}${link('Teamcraft 共同清單','https://wiki.ffxivteamcraft.com/advanced-features/teams','分工與共用進度的操作參考。')}${link('Airtable 表格編輯','https://support.airtable.com/articles/7905594155-airtable-grid-view','表格、分類與編輯操作參考。')}</div></section></div><section class="panel"><h2>遊戲圖片來源</h2><p>${Object.keys(DATA.icons).length} 個素材與零件圖示依官方物品識別碼對應 Lodestone；莫古力插圖取自官方活動頁。遊戲圖示與插圖 © SQUARE ENIX。</p><div class="linkbar"><a href="https://na.finalfantasyxiv.com/lodestone/special/mogmog-collection/202507/5jc8r6hlb2" target="_blank" rel="noreferrer">莫古力官方活動頁 ↗</a><a href="${BASE_PATH}/assets/icon-sources.json" target="_blank" rel="noreferrer">逐項圖示來源 ↗</a></div><h2 style="margin-top:26px">逐項配方來源</h2><p>官方素材配方連結可在備料主頁點材料名稱查看。以下是完整工房施工用料來源。</p><div class="source-list">${DATA.parts.map(p=>link(p.name,p.url,`每件 ${Object.keys(p.ingredients).length} 種素材，採各階段 Total 欄並加總。`)).join('')}</div></section>`;
}

({workshop,guide:guidePage,parts:partsPage,voyages:voyagesPage,sources:sourcesPage,lookup:lookupPage,planner:plannerPage,compare:comparisonPage})[page]();refresh();setInterval(refresh,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});window.addEventListener('beforeunload',e=>{if(Object.keys(drafts).length){e.preventDefault();e.returnValue='';}});
